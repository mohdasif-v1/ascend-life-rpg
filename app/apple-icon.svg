<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Obsidian Base Tile -->
  <rect width="64" height="64" rx="16" fill="#070709"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#272738" stroke-width="1.5"/>

  <!-- Subtle Arcane Background Bloom -->
  <circle cx="32" cy="32" r="22" fill="#8b5cf6" fill-opacity="0.2" filter="blur(6px)"/>

  <!-- Ascension Chevron Blade -->
  <path
    d="M32 8L52 48H41.5L32 28.5L22.5 48H12L32 8Z"
    fill="url(#asc-blade-grad)"
    stroke="#c4b5fd"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Relic Core Amber Apex Prism -->
  <polygon
    points="32,22 37.5,38 26.5,38"
    fill="url(#asc-core-grad)"
    stroke="#fef3c7"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Zenith Luminary Star -->
  <circle cx="32" cy="15" r="2.5" fill="#ffffff"/>

  <defs>
    <linearGradient id="asc-blade-grad" x1="12" y1="8" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5fd"/>
      <stop offset="0.4" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="asc-core-grad" x1="26.5" y1="22" x2="37.5" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
