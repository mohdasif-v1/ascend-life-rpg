<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <rect width="1200" height="630" fill="#070709"/>
  <rect x="2" y="2" width="1196" height="626" stroke="#272738" stroke-width="2"/>
  <circle cx="600" cy="180" r="320" fill="#8b5cf6" fill-opacity="0.12" filter="blur(80px)"/>

  <!-- Sigil Icon matching Logo.tsx & icon.svg -->
  <g transform="translate(540, 80) scale(1.9)">
    <defs>
      <linearGradient id="og-blade-grad" x1="12" y1="8" x2="52" y2="48" gradientUnits="userSpaceOnUse">
        <stop stop-color="#c4b5fd"/>
        <stop offset="0.4" stop-color="#8b5cf6"/>
        <stop offset="1" stop-color="#4c1d95"/>
      </linearGradient>
      <linearGradient id="og-core-grad" x1="26.5" y1="22" x2="37.5" y2="38" gradientUnits="userSpaceOnUse">
        <stop stop-color="#fbbf24"/>
        <stop offset="1" stop-color="#d97706"/>
